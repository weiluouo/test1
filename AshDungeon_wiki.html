135.2,"attackRange":77,"attackCooldownMs":1400,"windupMs":560,"skills":[{"id":"goldenGrace","name":"南摩三滿多","durationMs":2000},{"id":"stackingMight","name":"毋陀南．婆日拉","attackMultiplierAdd":0.1,"armorAdd":3},{"id":"serpentShield","name":"那伽那伽密","shieldRatio":0.75,"durationMs":5000}]},{"id":"trefasha","name":"末代特雷法沙王","icon":"🐂","baseHp":120,"baseAtk":8,"speed":104,"attackRange":77,"attackCooldownMs":1400,"windupMs":560,"phaseThreshold":0.5,"phase2SpeedMultiplier":1.5,"skills":[{"id":"axeCleave","name":"斧劈","phase":1,"chargeMs":2000,"widthCells":2,"damageMultiplier":1.55},{"id":"bullCall","name":"公牛喚來","phase":1,"summonCount":1},{"id":"wrathKing","name":"暴怒之王","phase":1,"attackMultiplier":1.3,"durationMs":3000},{"id":"thunderCleave","name":"雷霆的拉布列斯","phase":2,"chargeMs":1000,"widthCells":2.5,"damageMultiplier":2.25},{"id":"heavenBull","name":"天星的金牛","phase":2,"summonCount":2},{"id":"fallenKingdom","name":"亡國之恨","phase":2,"attackMultiplier":1.5,"damageTakenMultiplier":1.2,"durationMs":3000}]}],"environments":[{"name":"王子尖塔環境","id":"prince-spires","description":"尖塔群聳立於金色夢境","scene":"golden-spires","bossId":"prince","obstacleStyle":"spires","contentSlots":{"bossDeathCinematic":{"items":[],"status":"reserved","enabled":false},"environmentEntryCinematic":{"items":[],"status":"reserved","enabled":false},"smallMobs":{"items":[],"status":"reserved","enabled":false},"intelItems":{"items":[],"status":"reserved","enabled":false},"bossIntroCinematic":{"items":[],"status":"reserved","enabled":false}}},{"name":"札里安廢墟環境","id":"zarian-ruins","description":"龍影盤踞的焦黑廢墟","scene":"ashen-ruins","bossId":"zarian","obstacleStyle":"ruins","contentSlots":{"bossDeathCinematic":{"items":[],"status":"reserved","enabled":false},"environmentEntryCinematic":{"items":[],"status":"reserved","enabled":false},"smallMobs":{"items":[],"status":"reserved","enabled":false},"intelItems":{"items":[],"status":"reserved","enabled":false},"bossIntroCinematic":{"items":[],"status":"reserved","enabled":false}}},{"name":"特雷法沙王獸塚環境","id":"trefasha-bones","description":"牛王遺骸堆砌的古老戰場","scene":"beast-tomb","bossId":"trefasha","obstacleStyle":"bull-skulls","contentSlots":{"bossDeathCinematic":{"items":[],"status":"reserved","enabled":false},"environmentEntryCinematic":{"items":[],"status":"reserved","enabled":false},"smallMobs":{"items":[],"status":"reserved","enabled":false},"intelItems":{"items":[],"status":"reserved","enabled":false},"bossIntroCinematic":{"items":[],"status":"reserved","enabled":false}}},{"name":"夢境王座環境","id":"dream-kingdom","description":"維持夢境王座原有場景","scene":"dream-throne","bossId":"dreamKing","obstacleStyle":"original","contentSlots":{"bossDeathCinematic":{"items":[],"status":"reserved","enabled":false},"environmentEntryCinematic":{"items":[],"status":"reserved","enabled":false},"smallMobs":{"items":[],"status":"reserved","enabled":false},"intelItems":{"items":[],"status":"reserved","enabled":false},"bossIntroCinematic":{"items":[],"status":"reserved","enabled":false}}}],"cinematicSlots":{"arrivalCinematic":{"items":[],"status":"reserved","enabled":false},"evacuationCinematic":{"items":[],"status":"reserved","enabled":false}}}}</script>
<script id="catalog-renderer">
(()=>{
 const data=JSON.parse(document.getElementById('catalog-data').textContent);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const art=(icon,fallback='✦')=>String(icon||'').startsWith('data:image/svg+xml,')?`<img src="${esc(icon)}" alt="事件圖示">`:/\.png$/i.test(icon||'')?`<img class="icon-file" src="GameData/${esc(icon)}" alt=""><span class="icon-fallback" hidden>${esc(fallback)}</span>`:`<span>${esc(icon||fallback)}</span>`;
 const card=(name,icon,kind,description,stats='',details='',iconFallback='✦')=>`<article class="entry-card ${icon?'':'no-art'} ${name==='天星的金牛'?'golden-bull':''}"><div class="entry-head">${icon?`<div class="entry-art">${art(icon,iconFallback)}</div>`:''}<div><h2>${esc(name)}</h2><div class="entry-kind">${esc(kind)}</div></div></div><div class="entry-copy">${description||''}${stats?`<div class="entry-stats">${stats}</div>`:''}${details?`<details><summary>查看詳細資料</summary>${details}</details>`:''}</div></article>`;
 const panels={monsters:[],weapons:[],bosses:[],upgrades:[],stats:[],relics:[],events:[]};
 const summonLore={'zarian-black-mud':'從札里安身上掉落下來的蠕動怪物，會口吐汙濁的物體，射向途經的任何生命。','zarian-crystal':'札里安人的獨特科技造物，能夠展開獨特的能量立場，汲取原生環境的諸多能量，恢復高貴的札里安所受的傷勢。'};
 const extraSummons=[{id:'trefasha-bull',name:'特雷法沙公牛',icon:'🐂',fallbackIcon:'🐂',description:'迦斐托島的公牛尤其強壯，那宏偉的身姿深受同源的阿斯忒里翁所喜愛，相傳其衝鋒時能夠撞飛一百個兵士。',codexSummon:true},{id:'heaven-golden-bull',name:'天星的金牛',icon:'🐂',fallbackIcon:'🐂',description:'最為強大、憤怒的牡牛，在雷霆的淬鍊後身泛金色的輝光，仍能受到地上的牛鳴喚起天翻地覆的災禍。',codexSummon:true}];
 const monsterEntries=[...(data.monsters.monsters||[]).map(m=>({...m,codexSummon:!!m.supportOnly})),...Object.values(data.monsters.summons||{}).map(m=>({...m,codexSummon:true,description:summonLore[m.id]||m.description||m.note||''})),...extraSummons];
 panels.monsters=monsterEntries.map(m=>{const stats=m.hp!==undefined||m.hpRatio!==undefined||m.atk!==undefined||m.attackRatio!==undefined||m.speed!==undefined?`生命 ${esc(m.hp??(m.hpRatio!==undefined?`${Math.round(m.hpRatio*100)}% BOSS HP`:'—'))}　攻擊 ${esc(m.atk??m.attackRatio??'—')}　移速 ${esc(m.speed??'—')}`:'';const detail=m.codexSummon?`召喚來源：${esc(m.id?.startsWith('zarian-')?'漆黑的札里安':m.id?.includes('heaven')?'末代特雷法沙王（二階段）':'末代特雷法沙王')}`:`攻擊方式：${esc(m.attackType||m.classType||'—')}；攻擊距離：${esc(m.attackRange??'—')}；警戒範圍：${esc(m.aggroRange??'—')}。`;return card(m.name,m.mapIconFile||m.fallbackIcon||m.icon||'👾',m.codexSummon?'BOSS 召喚物':(m.roleLabel||m.classType||'夢幻境敵人'),esc(m.description||m.note||'尚未提供描述。'),stats,detail)});
 const weaponFallback={short:'🗡️',long:'⚔️',spear:'🔱',bow:'🏹',gunlance:'🔫',staff:'🪄'};
 panels.weapons=(data.weapons.weapons||[]).map(w=>card(w.name,w.icon||weaponFallback[w.id]||w.fallbackIcon||'⚔️',w.id||'unknown',esc(w.description||''),`傷害倍率 ×${esc(w.mult??'—')}　射程 ${esc(w.range??'—')}　冷卻 ${(Number(w.cooldown||0)/1000).toFixed(1)} 秒${w.wall?'　可穿牆':''}`,`攻擊特性：${esc(w.role||'一般攻擊')}。`,weaponFallback[w.id]||w.fallbackIcon||'⚔️'));
 const bossTotems={prince:'蛇頭.png',zarian:'札里安.png',trefasha:'牛頭.png',dreamKing:'夢境.png'};
 const bosses=[{...data.boss.dreamKing,name:'夢境君王',icon:'👑',id:'dreamKing'},...(data.boss.bosses||[])];
 const bossStages={dreamKing:3,zarian:2,trefasha:2,prince:1};
 const bossQuotes={dreamKing:'「迷惘的山羊卻是整片幻夢的君主，如此荒誕詭誕之景恰是虛假的真理。」',zarian:'「在███的帶領下，自異星降臨的魔怪以侵略、征服、毀滅，步步吞噬。」',prince:'「口唸神咒的王子創立屬野獸的千頂室立，卻無奈身染漆黑，國破家亡。」',trefasha:'「糧倉已經告鑿，牛首動身掠劫豐饒的人之國，隨之引來了報復與亡國。」'};
 const bossGuide={
  dreamKing:{phaseGroups:[{title:'第一階段｜近戰',intro:'生命高於 70% 時，以近戰形態追擊。',skills:['【王座斬擊】逼近玩家後揮擊，利用走位避開貼身攻擊。','【夢縛侍從】召喚夢縛侍從牽制玩家。']},{title:'第二階段｜遠程',intro:'生命降至 70% 以下，改以遠程攻擊並召喚支援。',skills:['【幻夢裂彈】從遠處發射夢境彈體，移動躲避飛行軌跡。','【噬夢孢子】召喚噬夢孢子，牠會以遠程攻擊持續施壓。']},{title:'第三階段｜騎兵',intro:'生命降至 30% 以下，化為高速騎兵追擊。',skills:['【王座衝鋒】快速拉近距離並發動衝撞，留意蓄勢方向。','【失誓小像】召喚失誓小像協助作戰，優先清理可減少干擾。']}]},
  zarian:{phaseGroups:[{title:'第一階段｜純遠程',intro:'第一階段純遠程，每 0.8 秒發射一枚快速鱗片。',skills:['【淵火成雨】地上出現隨機複數圓圈，而後落下火球。','【龍威似海】龍威短暫禁錮玩家行動。','【異星水晶】召喚不動的水晶，存在就會幫札里安緩慢回血。']},{title:'第二階段｜純近戰',intro:'第一階段被擊敗後，短暫復活並轉為快速近戰。',skills:['【亞空污穢】召喚亞空黑泥，會遠程攻擊玩家。','【淵火灼地】朝前方吐出扇形的火焰。','【外域科技】觸發後自身獲得護盾，不打破就會緩慢回血。']}]},
  prince:{phaseGroups:[{title:'唯一階段｜純近戰',intro:'只有一個階段，以高生命、中等速度與近戰攻擊作戰。',skills:['【南摩三滿多】將環境變為黃金色，期間內自己造成的傷害都會恢復自身傷勢。','【毋陀南．婆日拉】使用後自身攻擊與防禦加成，每次使用都會疊加。','【那伽那伽密】獲得基於自身生命的護盾，期間自身靜止不動；限時內若未打破，玩家會瀕死重傷。']}]},
  trefasha:{phaseGroups:[{title:'第一階段｜純近戰',intro:'第一階段以近戰追擊，生命降至 50% 時轉換階段。',skills:['【斧劈】蓄力後造成一直線向外擴散的範圍傷害，離中心線越遠傷害越低。','【公牛喚來】召喚一隻巨大的牛直線衝向玩家造成傷害，撞到牆後消失。','【暴怒之王】渲染為紅色，自身攻擊短時間內大幅加成。']},{title:'第二階段｜純近戰・速度提升',intro:'第二階段仍為近戰，移動速度提高 50%。',skills:['【雷霆的拉布列斯】短暫蓄力後造成一直線加擴散的更高範圍傷害，離中心線越遠傷害越低。','【天星的金牛】連續召喚兩隻巨大的牛直線衝向玩家造成傷害，撞到牆後消失。','【亡國之恨】渲染為紅色，短時間內自身攻擊極大幅加成、獲得易傷。']}]}
 };
 panels.bosses=bosses.map(b=>{const guide=bossGuide[b.id];const phaseGroups=guide?.phaseGroups||[{title:'招式',intro:'依首領資料設定施展技能。',skills:(b.skills||[]).map(s=>`【${s.name||s.id}】${s.description||'施展特殊攻擊。'}`)}];const details=phaseGroups.map(group=>`<h3>${esc(group.title)}</h3><p>${esc(group.intro)}</p><ul>${group.skills.map(skill=>`<li>${esc(skill)}</li>`).join('')}</ul>`).join('');const quote=esc(bossQuotes[b.id]||'');const intro=`<blockquote class="boss-quote">${quote}</blockquote>`;return card(b.name,bossTotems[b.id]||b.icon,`${['','一','二','三'][bossStages[b.id]||1]}階段BOSS`,intro,`生命 ${esc(b.baseHp??'—')}　攻擊 ${esc(b.baseAtk??'—')}　移速 ${esc(b.speed??'—')}`,details)});
 panels.upgrades=(data.upgrades.upgrades||[]).map(u=>card(u.name,u.icon,'局內強化',esc(u.desc||''),`抽選權重 ${esc(u.weight??'—')}`,`效果參數：${esc((u.effects||[]).map(e=>`${e.type} ${e.value??''}`).join('；')||'依強化說明套用')}`));
 panels.stats=[['生命值','目前生命與生命上限；恢復不會超過上限。'],['攻擊力','依武器倍率計算命中時的基礎傷害。'],['暴擊機率','每次命中觸發暴擊的機率。'],['常駐減傷','每次受擊固定扣除的傷害值。'],['本層首次額外減傷','每層第一次受擊時額外套用的減傷。'],['回血量／每 5 秒','角色自然恢復生命的速度。'],['藥水治療量／剩餘藥水','每瓶藥水恢復量與剩餘可用次數。'],['移動速度','角色在地圖上的移動速率。'],['武器攻擊半徑','武器可以命中敵人的距離範圍。'],['命中冷卻／空揮冷卻','攻擊後的等待時間；空揮依武器規則處理。'],['律質','遠征收集的貨幣，用於結算與局外英雄鍛造。']].map(([n,d])=>card(n,null,'面板詞條',esc(d)));
 panels.relics=(data.relics.relics||[]).map(r=>{const effects=Array.isArray(r.effects)?r.effects:Array.isArray(r.effect)?r.effect:r.effect?[r.effect]:[];return card(r.name,r.icon||r.fallbackIcon,(r.tags||[]).join(' · ')||'遠征遺物',esc(r.desc||''),r.bossRelicFor?`首領專屬：${esc(r.bossRelicFor)}`:'可於遠征中取得',effects.length?`效果：${esc(effects.map(e=>`${e.type} ${e.value??''}${e.durationMs?`，持續 ${e.durationMs/1000} 秒`:''}`).join('；'))}`:'效果依遺物說明。')});
 const eventGlyphs=[['洪流|水|雨|洪','🌊','#397d93'],['石崩|岩|山崩','🪨','#76604c'],['流星|星','☄️','#51476e'],['蟲|狼|野狗','🐾','#8a6845'],['獵人','🏹','#725739'],['妖精|魔力','🧚','#587d68'],['邪靈|惡靈|祭司','👻','#584a70'],['村民|村落|糧倉','🏘️','#9a6943'],['竊賊|慣盜','🗝️','#685b48'],['邪祀|獻祭|祭壇','🕯️','#6f3f49'],['族群|獸窩|獸群','🐗','#6f7543'],['水庫|水生|隱湖','🐚','#3d7280'],['骷髏|伏擊','💀','#554a53'],['旅者|救援|陷阱','🛟','#557168'],['秘寶|寶藏','💎','#78623a'],['採集|地景','🌿','#57734f']];
 const eventIcon=e=>{const text=`${e.title||''} ${e.story||''}`;const match=eventGlyphs.find(([words])=>words.split('|').some(word=>text.includes(word)));const glyph=match?.[1]||'✧',color=match?.[2]||'#665477';const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="g"><stop stop-color="#f6e4b6"/><stop offset="1" stop-color="${color}"/></radialGradient></defs><circle cx="48" cy="48" r="46" fill="url(#g)"/><circle cx="48" cy="48" r="39" fill="none" stroke="#f5dfad" stroke-opacity=".75" stroke-width="2"/><path d="M14 68Q48 48 82 68" fill="none" stroke="#281d20" stroke-opacity=".3" stroke-width="5"/><text x="48" y="60" text-anchor="middle" font-size="42">${glyph}</text></svg>`;return `data:image/svg+xml,${encodeURIComponent(svg)}`};
 panels.events=(data.scenarios.events||[]).map(e=>{const choices=(e.choices||[]).map(c=>`<li><b>${esc(c.label)}</b>${c.outcomes?.length?`<ul>${c.outcomes.map(o=>`<li>${esc(o.text)}</li>`).join('')}</ul>`:''}</li>`).join('');return card(e.title,eventIcon(e),e.category||'夢境事件',esc(e.story||''),`出現樓層 ${esc(e.minFloor??1)}–${esc(e.maxFloor??'—')}　權重 ${esc(e.weight??1)}`,`<p>可選行動</p><ul>${choices||'<li>依事件內容選擇。</li>'}</ul>`)});
 for(const [key,items] of Object.entries(panels)){const panel=document.querySelector(`[data-panel="${key}"]`);if(panel)panel.innerHTML=`<div class="entry-grid">${items.join('')}</div>`}
 document.addEventListener('error',e=>{if(e.target.matches?.('.entry-art img.icon-file')){e.target.hidden=true;if(e.target.nextElementSibling)e.target.nextElementSibling.hidden=false}},true);
 const tabs=[...document.querySelectorAll('[data-tab]')],sections=[...document.querySelectorAll('[data-panel]')];tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(t=>t.classList.toggle('active',t===tab));sections.forEach(s=>s.classList.toggle('hidden',s.dataset.panel!==tab.dataset.tab));window.scrollTo({top:0,behavior:'smooth'})}));
})();
</script>
</html>
